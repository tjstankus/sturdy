# The toolchain this project is built and tested on.
[tools]
erlang = "29.1.1"
elixir = "1.20.4-otp-29"

# Loads the local, uncommitted .env (production settings and secrets) whenever
# you're in this project, so prod commands need no `source .env` first.
# Dev and test configs don't read these variables.
[env]
_.file = { path = ".env", redact = true }
